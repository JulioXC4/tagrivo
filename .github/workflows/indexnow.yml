name: IndexNow production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compare production without sending notifications'
        type: boolean
        default: true

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  notify:
    if: github.repository == 'JulioXC4/tagrivo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test notification safeguards
        run: node --experimental-strip-types --test tests/indexnow*.test.ts
      - name: Locate last notification state
        id: state
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {owner, repo, name: 'indexnow-state-v1', per_page: 100});
            const matching = artifacts.filter(a => !a.expired && a.workflow_run?.head_branch === 'main').sort((a,b) => b.id-a.id);
            for (const artifact of matching) {
              const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: artifact.workflow_run.id});
              if (run.path !== '.github/workflows/indexnow.yml') continue;
              core.setOutput('run_id', String(run.id));
              core.setOutput('required', 'true');
              return;
            }
            const {data} = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'indexnow.yml', branch: 'main', per_page: 100});
            const completedBefore = data.workflow_runs.some(r => r.id !== context.runId && r.conclusion === 'success');
            core.setOutput('required', completedBefore ? 'true' : 'false');
      - name: Restore last notification state
        if: steps.state.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: indexnow-state-v1
          path: release-artifacts/indexnow
          run-id: ${{ steps.state.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Notify only verified production changes
        id: notify
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INDEXNOW_STATE_REQUIRED: ${{ steps.state.outputs.required }}
          INDEXNOW_EXTERNAL_PROVIDER: ${{ vars.INDEXNOW_EXTERNAL_PROVIDER }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/indexnow.mjs --dry-run
          else
            node scripts/indexnow.mjs --submit
          fi
      - name: Save state for subsequent deploys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-state-v1
          path: release-artifacts/indexnow/state.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
      - name: Save notification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/indexnow/report.json
          if-no-files-found: warn
          retention-days: 90
      - name: Report notification problem without blocking Cloudflare
        if: always() && steps.notify.outcome == 'failure'
        run: |
          echo '::warning::IndexNow notification failed or was skipped safely. Check the report artifact. Cloudflare deployment is independent.'
